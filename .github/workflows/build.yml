name: Build VCam

on:
  push:
    branches: [ main, test/baseline-unique-package ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid xz
      timeout-minutes: 10

    - name: Install Theos
      run: |
        curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos -o /tmp/install-theos
        # GitHub API access used by install-sdk can fail on hosted runners.
        # Keep the official RootHide installer flow, but replace only its SDK-fetch
        # command with the pinned direct release asset URL (no API request).
        python3 - <<'PY'
        from pathlib import Path
        p = Path("/tmp/install-theos")
        s = p.read_text()
        old = "$THEOS/bin/install-sdk latest && $THEOS/bin/install-sdk latest-tv"
        new = """mkdir -p "$THEOS/sdks"
        curl -fL --retry 3 --retry-delay 2 https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
        tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C "$THEOS/sdks"
        test -d "$THEOS/sdks/iPhoneOS16.5.sdk" """
        if old not in s:
            raise SystemExit("Could not locate SDK install command in RootHide installer")
        p.write_text(s.replace(old, new))
        PY
        bash /tmp/install-theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 10

    - name: Install iOS SDK
      run: |
        curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
        mkdir -p $HOME/theos/sdks
        tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
        echo "Installed SDKs:"
        ls $HOME/theos/sdks/
      timeout-minutes: 10

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        export THEOS_PACKAGE_SCHEME=roothide
        make clean
        make package FINALPACKAGE=1 2>&1
        echo "Build complete. Packages:"
        ls -lh packages/ 2>/dev/null || echo "No packages dir"
      timeout-minutes: 15

    - name: Extract dylib
      run: |
        mkdir -p output
        DEB=$(ls packages/*.deb 2>/dev/null | head -1)
        if [ -z "$DEB" ]; then
          echo "No deb found!"
          exit 1
        fi
        echo "Found: $DEB"
        cp "$DEB" output/
        cd output
        ar x ../packages/*.deb 2>/dev/null || dpkg-deb -x "$DEB" .
        find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        tar -xf data.tar* 2>/dev/null && find . -name "*.dylib" -exec cp {} ./VCam.dylib \; 2>/dev/null
        ls -lh

    - name: Upload dylib
      uses: actions/upload-artifact@v4
      with:
        name: VCam-dylib
        path: output/VCam.dylib
        retention-days: 30

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: output/*.deb
        retention-days: 30
